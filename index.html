<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N'INEZA Ltd — Car hire in Kigali, Rwanda</title>
<meta name="description" content="N'INEZA Ltd hires out the Kia Sorento, Land Cruiser Prado 2025 Full Option and Land Cruiser VXL in Kigali, Rwanda. Drive yourself or take a driver. Call 0723 346 316.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0a09;
    --panel:#14120e;
    --panel-2:#1b1812;
    --umber:#4a2f1c;
    --gold:#c79a3e;
    --gold-lt:#ebd08a;
    --gold-dp:#7d6129;
    --bone:#ede6d6;
    --bone-dim:#a49c8c;
    --hair:rgba(199,154,62,0.22);
    --plate:#f7f6f3;

    --display:'Bodoni Moda',Georgia,serif;
    --body:'Archivo',-apple-system,'Segoe UI',sans-serif;

    --gutter:clamp(20px,5vw,64px);
    --max:1280px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body{
    background:var(--ink); color:var(--bone);
    font-family:var(--body); font-weight:300; font-size:17px; line-height:1.65;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  :focus-visible{ outline:2px solid var(--gold-lt); outline-offset:3px; }

  .shell{ max-width:var(--max); margin:0 auto; padding:0 var(--gutter); }

  h1,h2,h3{ font-family:var(--display); font-weight:500; line-height:1.08; }
  h1{ font-size:clamp(2.7rem,7vw,5.4rem); letter-spacing:-0.015em; }
  h2{ font-size:clamp(2rem,4vw,3.1rem); letter-spacing:-0.01em; }
  h3{ font-size:clamp(1.5rem,2.6vw,2.15rem); }
  p{ max-width:62ch; }

  .gold-text{ color:var(--gold-lt); }
  .quiet{ color:var(--bone-dim); }

  /* ---------------- masthead ---------------- */
  .masthead{
    position:sticky; top:0; z-index:100;
    background:rgba(11,10,9,0.9);
    backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--hair);
  }
  .masthead-in{
    max-width:var(--max); margin:0 auto; padding:0 var(--gutter);
    height:78px; display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .seal{ display:flex; align-items:center; gap:13px; flex-shrink:0; }
  .seal img{ height:46px; width:46px; object-fit:contain; }
  .seal-name{ font-family:var(--display); font-size:1.32rem; letter-spacing:0.02em; color:var(--gold-lt); white-space:nowrap; }
  .seal-name em{ font-style:italic; font-size:0.72em; color:var(--bone-dim); }

  .compass{ display:flex; align-items:center; gap:30px; }
  .compass a{
    font-size:0.92rem; font-weight:400; color:var(--bone-dim);
    padding-bottom:3px; border-bottom:1px solid transparent; transition:color .2s, border-color .2s;
  }
  .compass a:hover{ color:var(--gold-lt); border-color:var(--gold); }

  .mast-right{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .lang{ display:flex; border:1px solid var(--gold-dp); }
  .lang button{
    font-size:0.75rem; letter-spacing:0.05em; padding:7px 13px;
    background:none; color:var(--bone-dim); border:none; cursor:pointer; transition:.2s;
  }
  .lang button[aria-pressed="true"]{ background:var(--gold); color:var(--ink); font-weight:500; }
  .burger{ display:none; background:none; border:none; color:var(--gold-lt); cursor:pointer; padding:6px; }
  .burger svg{ width:24px; height:24px; stroke:currentColor; stroke-width:1.6; fill:none; }

  /* ---------------- hero ---------------- */
  .hero{ position:relative; border-bottom:1px solid var(--hair); overflow:hidden; }
  .hero::before{
    content:''; position:absolute; top:-30%; right:-10%; width:70%; height:120%;
    background:radial-gradient(ellipse at center, rgba(199,154,62,0.13), transparent 68%);
    pointer-events:none;
  }
  .hero-in{
    max-width:var(--max); margin:0 auto; padding:clamp(56px,8vw,104px) var(--gutter) clamp(48px,7vw,88px);
    display:grid; grid-template-columns:1fr 1fr; gap:clamp(32px,5vw,72px); align-items:center;
    position:relative; z-index:2;
  }
  .hero-word{ max-width:17ch; }
  .hero h1 span{ display:block; }
  .hero h1 .thin{ font-weight:400; font-style:italic; color:var(--bone); }
  .hero-lede{ margin-top:28px; font-size:1.09rem; color:var(--bone-dim); max-width:46ch; }
  .hero-acts{ margin-top:36px; display:flex; gap:14px; flex-wrap:wrap; }
  .hero-reg{
    margin-top:34px; padding-top:20px; border-top:1px solid var(--hair);
    font-size:0.8rem; letter-spacing:0.09em; color:var(--gold-dp);
  }

  /* white photo plate — the signature device */
  .plate{
    position:relative; background:var(--plate);
    box-shadow:0 26px 70px -22px rgba(0,0,0,0.85);
  }
  .plate::after{
    content:''; position:absolute; inset:0; border:1px solid rgba(199,154,62,0.4); pointer-events:none;
  }
  .hero-plate{ aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; }
  .hero-plate img{ width:100%; height:100%; object-fit:contain; padding:7%; opacity:0; transition:opacity .9s ease; }
  .hero-plate img.in{ opacity:1; }
  .plate-tag{
    position:absolute; bottom:0; left:0; z-index:3;
    background:var(--ink); color:var(--gold-lt);
    font-size:0.72rem; letter-spacing:0.13em; padding:8px 15px;
    border-right:1px solid var(--hair); border-top:1px solid var(--hair);
  }

  /* ---------------- buttons ---------------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    padding:14px 28px; font-size:0.93rem; font-weight:500; letter-spacing:0.01em;
    cursor:pointer; border:1px solid transparent; transition:.25s;
  }
  .btn-solid{ background:linear-gradient(145deg,var(--gold-lt),var(--gold)); color:var(--ink); }
  .btn-solid:hover{ filter:brightness(1.1); }
  .btn-ghost{ border-color:var(--gold-dp); color:var(--gold-lt); }
  .btn-ghost:hover{ background:rgba(199,154,62,0.1); border-color:var(--gold); }
  .btn svg{ width:17px; height:17px; fill:currentColor; flex-shrink:0; }

  /* ---------------- section frame ---------------- */
  .band{ padding:clamp(64px,8vw,112px) 0; }
  .band-tint{ background:var(--panel); border-block:1px solid var(--hair); }
  .band-head{ margin-bottom:clamp(40px,5vw,64px); max-width:60ch; }
  .band-head h2 + p{ margin-top:16px; color:var(--bone-dim); }

  /* ---------------- fleet: alternating brochure spreads ---------------- */
  .spread{
    display:grid; grid-template-columns:1.05fr 1fr; gap:clamp(30px,5vw,66px);
    align-items:center; padding:clamp(44px,5vw,64px) 0;
    border-top:1px solid var(--hair);
  }
  .spread:first-of-type{ border-top:none; padding-top:0; }
  .spread.flip .spread-media{ order:2; }

  .spread-plate{ aspect-ratio:16/11; }
  .spread-plate .shot{
    width:100%; height:100%; object-fit:contain; padding:5%;
    cursor:zoom-in; transition:transform .5s cubic-bezier(.2,.7,.3,1);
  }
  .spread-plate:hover .shot{ transform:scale(1.035); }
  .shot-count{
    position:absolute; top:0; right:0; z-index:3;
    background:var(--ink); color:var(--bone-dim); font-size:0.7rem; letter-spacing:0.08em;
    padding:7px 12px; border-left:1px solid var(--hair); border-bottom:1px solid var(--hair);
  }

  .filmstrip{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .filmstrip button{
    width:66px; height:48px; padding:3px; cursor:pointer; background:var(--plate);
    border:1px solid var(--hair); opacity:.48; transition:opacity .2s, border-color .2s;
  }
  .filmstrip button img{ width:100%; height:100%; object-fit:contain; }
  .filmstrip button:hover{ opacity:.85; }
  .filmstrip button[aria-current="true"]{ opacity:1; border-color:var(--gold-lt); }

  .spread-body .model{ font-size:0.79rem; letter-spacing:0.11em; color:var(--gold); margin-bottom:12px; }
  .spread-body h3{ margin-bottom:18px; }
  .spread-body p{ color:var(--bone-dim); font-size:1.02rem; }

  /* spec sheet — hairline definition rows carry real data */
  .spec{ margin:26px 0 30px; border-top:1px solid var(--hair); }
  .spec div{
    display:flex; justify-content:space-between; gap:20px; align-items:baseline;
    padding:11px 0; border-bottom:1px solid var(--hair);
  }
  .spec dt{ font-size:0.86rem; color:var(--bone-dim); }
  .spec dd{ font-size:0.94rem; color:var(--bone); text-align:right; font-weight:400; }

  .fleet-foot{
    margin-top:clamp(36px,4vw,52px); padding:24px 26px;
    background:var(--panel-2); border-left:2px solid var(--gold);
    font-size:0.95rem; color:var(--bone-dim);
  }
  .fleet-foot strong{ color:var(--gold-lt); font-weight:500; }

  /* ---------------- lightbox ---------------- */
  .viewer{
    position:fixed; inset:0; z-index:300; background:rgba(8,7,6,0.96);
    display:none; align-items:center; justify-content:center; flex-direction:column; padding:64px 20px 40px;
  }
  .viewer.open{ display:flex; }
  .viewer-img{ max-width:min(1120px,92vw); max-height:72vh; object-fit:contain; background:var(--plate); padding:2%; }
  .viewer-cap{ margin-top:20px; font-size:0.88rem; color:var(--bone-dim); letter-spacing:0.05em; text-align:center; }
  .viewer-x{
    position:absolute; top:18px; right:22px; background:none; border:none;
    color:var(--gold-lt); font-size:2rem; line-height:1; cursor:pointer; padding:8px;
  }
  .viewer-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:50px; height:50px; background:rgba(199,154,62,0.1);
    border:1px solid var(--gold-dp); color:var(--gold-lt);
    font-size:1.4rem; cursor:pointer; transition:background .2s;
  }
  .viewer-arrow:hover{ background:rgba(199,154,62,0.26); }
  .v-prev{ left:18px; } .v-next{ right:18px; }

  /* ---------------- about ---------------- */
  .about{ display:grid; grid-template-columns:0.8fr 1.2fr; gap:clamp(34px,5vw,72px); align-items:center; }
  .crest{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--hair);
    background:radial-gradient(ellipse at 50% 42%, rgba(199,154,62,0.1), transparent 70%);
  }
  .crest img{ width:58%; }
  .about p + p{ margin-top:16px; }
  .about-figs{ display:flex; gap:44px; margin-top:32px; flex-wrap:wrap; }
  .about-figs b{ display:block; font-family:var(--display); font-size:1.7rem; font-weight:500; color:var(--gold-lt); }
  .about-figs span{ font-size:0.83rem; color:var(--bone-dim); }

  /* ---------------- promises (not a sequence → no numbers) ---------------- */
  .promises{ display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--hair); border:1px solid var(--hair); }
  .promise{ background:var(--ink); padding:clamp(28px,3.4vw,40px); }
  .promise h3{ font-size:1.32rem; margin-bottom:11px; }
  .promise p{ font-size:0.94rem; color:var(--bone-dim); }
  .promise::before{
    content:''; display:block; width:26px; height:2px;
    background:var(--gold); margin-bottom:20px;
  }

  /* ---------------- enquiry ---------------- */
  .enquire{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:clamp(36px,5vw,72px); }
  .reach > div{ padding:19px 0; border-bottom:1px solid var(--hair); }
  .reach > div:first-child{ padding-top:0; }
  .reach dt{ font-size:0.8rem; color:var(--bone-dim); margin-bottom:5px; }
  .reach dd{ font-size:1.04rem; color:var(--bone); word-break:break-word; }
  .reach a:hover{ color:var(--gold-lt); }

  .form{ background:var(--panel-2); border:1px solid var(--hair); padding:clamp(26px,3.4vw,40px); }
  .form h3{ font-size:1.5rem; margin-bottom:8px; }
  .form-note{ font-size:0.88rem; color:var(--bone-dim); margin-bottom:24px; }
  .f-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .f{ margin-bottom:16px; }
  .f label{ display:block; font-size:0.82rem; color:var(--bone-dim); margin-bottom:7px; }
  .f input, .f select, .f textarea{
    width:100%; background:var(--ink); border:1px solid var(--hair); color:var(--bone);
    padding:12px 14px; font-family:var(--body); font-size:0.96rem; font-weight:300; outline:none; transition:border-color .2s;
  }
  .f input:focus, .f select:focus, .f textarea:focus{ border-color:var(--gold); }
  .f textarea{ resize:vertical; min-height:84px; }
  .form .btn{ width:100%; margin-top:4px; }
  .form-alert{ margin-top:14px; font-size:0.88rem; color:var(--gold-lt); display:none; }
  .form-alert.show{ display:block; }

  /* ---------------- colophon ---------------- */
  .colophon{ border-top:1px solid var(--hair); padding:44px 0 30px; }
  .colophon-in{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:22px; }
  .colophon .seal img{ height:40px; width:40px; }
  .colophon-reg{ font-size:0.72rem; letter-spacing:0.09em; color:var(--gold-dp); margin-top:2px; }
  .colophon nav{ display:flex; gap:26px; font-size:0.9rem; color:var(--bone-dim); }
  .colophon nav a:hover{ color:var(--gold-lt); }
  .colophon-base{
    margin-top:30px; padding-top:22px; border-top:1px solid var(--hair);
    font-size:0.79rem; color:var(--bone-dim); text-align:center;
  }

  /* ---------------- floating whatsapp ---------------- */
  .wa{
    position:fixed; bottom:22px; right:22px; z-index:90;
    width:54px; height:54px; border-radius:50%;
    background:linear-gradient(145deg,var(--gold-lt),var(--gold));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 26px rgba(0,0,0,0.6); transition:transform .22s;
  }
  .wa:hover{ transform:scale(1.07); }
  .wa svg{ width:27px; height:27px; fill:var(--ink); }

  .empty-plate{
    display:flex; align-items:center; justify-content:center; text-align:center;
    height:100%; padding:26px; background:var(--panel-2);
    color:var(--gold-dp); font-size:0.88rem;
  }

  /* ---------------- responsive ---------------- */
  @media (max-width:1000px){
    .hero-in{ grid-template-columns:1fr; }
    .hero-word{ max-width:none; }
    .hero-plate{ aspect-ratio:16/10; }
    .spread{ grid-template-columns:1fr; gap:28px; }
    .spread.flip .spread-media{ order:0; }
    .about{ grid-template-columns:1fr; }
    .crest{ max-width:250px; }
    .enquire{ grid-template-columns:1fr; }
  }
  @media (max-width:720px){
    body{ font-size:16px; }
    .compass{
      position:fixed; top:78px; left:0; right:0;
      flex-direction:column; align-items:flex-start; gap:18px;
      background:var(--ink); border-bottom:1px solid var(--hair);
      padding:24px var(--gutter); transform:translateY(-160%); transition:transform .34s;
    }
    .compass.open{ transform:translateY(0); }
    .burger{ display:block; }
    .promises{ grid-template-columns:1fr; }
    .f-row{ grid-template-columns:1fr; }
    .viewer-arrow{ width:42px; height:42px; font-size:1.1rem; }
    .v-prev{ left:6px; } .v-next{ right:6px; }
    .filmstrip button{ width:58px; height:42px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
    html{ scroll-behavior:auto; }
    .hero-plate img{ opacity:1; }
  }
</style>
</head>

      <h2 data-en="A small fleet, looked after properly" data-ky="Imodoka nkeya, zitabwaho neza"></h2>
      <p data-en="N'INEZA Ltd is a registered Rwandan company working out of Kigali. We deliberately keep the fleet small. It means we know every car, we know its service history, and nothing goes out to a client in a state we would not accept ourselves." data-ky="N'INEZA Ltd ni ikigo cy'u Rwanda cyanditswe, gikorera i Kigali. Twahisemo kugira imodoka nkeya. Bivuze ko tuzi imodoka yose, tuzi amateka yo kuyisana, kandi nta na imwe ijya ku mukiriya iri mu buryo tutakwemera twe ubwacu."></p>
      <p data-en="Tell us where you are going and how long for, and we will tell you which of the three fits and what it costs. If the car you want is already out, we will say so rather than waste your time." data-ky="Tubwire aho ugiye n'igihe kingana iki, tuzakubwira iyihe muri izo eshatu ikubereye n'igiciro cyayo. Niba imodoka ushaka yamaze kujya ahandi, tuzakubwira ukuri aho kukubuza igihe."></p>

  <button class="viewer-arrow v-next" id="vNext" type="button" aria-label="Next">&#8250;</button>
  <p class="viewer-cap" id="vCap"></p>
</div>

<script>
/* ===================================================================
   AMAFOTO — PHOTO SETTINGS
   -------------------------------------------------------------------
   Amafoto ari muri dosiye "images", ari .png.
   Niba wongeyeho ifoto nshya, ongeraho izina ryayo hano gusa.
   =================================================================== */
const DIR  = "images";
const EXTS = [".png", ".PNG", ".jpg", ".jpeg", ".JPG", ".webp"];

const CARS = {
  sorento: { name: "Kia Sorento",
             shots: ["sor1","sor2","sor3","sor4"] },
  prado:   { name: "Land Cruiser Prado 2025 Full Option",
             shots: ["land1","land2","land3","land4","land5"] },
  vxl:     { name: "Land Cruiser VXL",
             shots: ["v1","v2"] }
};

const HERO_SHOT = "land6";

/* --- find the file, whatever its extension --- */
function findFile(base){
  return new Promise(done => {
    let i = 0;
    (function attempt(){
      if (i >= EXTS.length) return done(null);
      const url = DIR + "/" + base + EXTS[i++];
      const probe = new Image();
      probe.onload  = () => done(url);
      probe.onerror = attempt;
      probe.src = url;
    })();
  });
}

/* --- hero --- */
findFile(HERO_SHOT).then(url => {
  if (!url) return;
  const el = document.getElementById("heroShot");
  el.src = url;
  el.addEventListener("load", () => el.classList.add("in"), { once:true });
  if (el.complete) el.classList.add("in");
});

/* --- viewer (lightbox) --- */
const viewer = document.getElementById("viewer");
const vImg   = document.getElementById("vImg");
const vCap   = document.getElementById("vCap");
let   vList = [], vAt = 0, vName = "", vOpener = null;

function vDraw(){
  vImg.src = vList[vAt];
  vImg.alt = vName;
  vCap.textContent = vName + "  —  " + (vAt + 1) + " / " + vList.length;
  document.getElementById("vPrev").style.visibility = vList.length > 1 ? "visible" : "hidden";
  document.getElementById("vNext").style.visibility = vList.length > 1 ? "visible" : "hidden";
}
function vOpen(list, at, name, opener){
  vList = list; vAt = at; vName = name; vOpener = opener || null;
  vDraw();
  viewer.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("vClose").focus();
}
function vShut(){
  viewer.classList.remove("open");
  document.body.style.overflow = "";
  if (vOpener) vOpener.focus();
}
function vStep(n){
  if (vList.length < 2) return;
  vAt = (vAt + n + vList.length) % vList.length;
  vDraw();
}
document.getElementById("vClose").addEventListener("click", vShut);
document.getElementById("vPrev").addEventListener("click", e => { e.stopPropagation(); vStep(-1); });
document.getElementById("vNext").addEventListener("click", e => { e.stopPropagation(); vStep(1); });
viewer.addEventListener("click", e => { if (e.target === viewer || e.target === vImg) vShut(); });
document.addEventListener("keydown", e => {
  if (!viewer.classList.contains("open")) return;
  if (e.key === "Escape")     vShut();
  if (e.key === "ArrowLeft")  vStep(-1);
  if (e.key === "ArrowRight") vStep(1);
});

/* --- build each vehicle spread --- */
document.querySelectorAll("[data-car]").forEach(async block => {
  const car = CARS[block.dataset.car];
  if (!car) return;

  const shot   = block.querySelector(".shot");
  const strip  = block.querySelector(".filmstrip");
  const count  = block.querySelector(".shot-count");
  const holder = block.querySelector(".spread-plate");

  const urls = (await Promise.all(car.shots.map(findFile))).filter(Boolean);

  /* nothing found → say what to do, don't show a broken frame */
  if (!urls.length){
    holder.innerHTML = '<div class="empty-plate">Shyira amafoto za ' + car.shots.join(", ")
                     + ' (.png) muri dosiye <b>' + DIR + '/</b></div>';
    holder.style.cursor = "default";
    return;
  }

  let at = 0;
  const show = i => {
    at = i;
    shot.src = urls[i];
    count.textContent = (i + 1) + " / " + urls.length;
    strip.querySelectorAll("button").forEach((b, j) =>
      b.setAttribute("aria-current", j === i ? "true" : "false"));
  };

  shot.alt = car.name;
  show(0);

  if (urls.length > 1){
    urls.forEach((url, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", car.name + " " + (i + 1));
      b.setAttribute("aria-current", i === 0 ? "true" : "false");
      const t = document.createElement("img");
      t.src = url; t.alt = ""; t.loading = "lazy";
      b.appendChild(t);
      b.addEventListener("click", () => show(i));
      strip.appendChild(b);
    });
  }

  shot.addEventListener("click", () => vOpen(urls, at, car.name, shot));
  shot.setAttribute("tabindex", "0");
  shot.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); vOpen(urls, at, car.name, shot); }
  });
});

/* --- language --- */
function setLang(code){
  document.documentElement.setAttribute("data-lang", code);
  document.documentElement.setAttribute("lang", code === "ky" ? "rw" : "en");
  document.getElementById("bEn").setAttribute("aria-pressed", String(code === "en"));
  document.getElementById("bKy").setAttribute("aria-pressed", String(code === "ky"));
  document.querySelectorAll("[data-en]").forEach(el => {
    const txt = code === "ky" ? (el.dataset.ky || el.dataset.en) : el.dataset.en;
    if (txt !== undefined) el.innerHTML = txt;
  });
}
document.getElementById("bEn").addEventListener("click", () => setLang("en"));
document.getElementById("bKy").addEventListener("click", () => setLang("ky"));

/* --- mobile menu --- */
const compass = document.getElementById("compass");
const burger  = document.getElementById("burger");
burger.addEventListener("click", () => {
  const open = compass.classList.toggle("open");
  burger.setAttribute("aria-expanded", String(open));
});
compass.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
  compass.classList.remove("open");
  burger.setAttribute("aria-expanded", "false");
}));

/* --- "Ask about X" preselects that car --- */
document.querySelectorAll("[data-car-pick]").forEach(link => {
  link.addEventListener("click", () => {
    document.getElementById("qCar").value = link.dataset.carPick;
  });
});

/* --- enquiry → WhatsApp --- */
document.getElementById("qSend").addEventListener("click", () => {
  const v = id => document.getElementById(id).value.trim();
  const name = v("qName"), phone = v("qPhone");
  const alert = document.getElementById("qAlert");

  if (!name || !phone){
    alert.classList.add("show");
    document.getElementById(name ? "qPhone" : "qName").focus();
    return;
  }
  alert.classList.remove("show");

  const lines = [
    "Muraho N'INEZA Ltd,",
    "",
    "Amazina: " + name,
    "Telefoni: " + phone,
    "Imodoka: " + document.getElementById("qCar").value
  ];
  if (v("qFrom")) lines.push("Kuva: " + v("qFrom"));
  if (v("qTo"))   lines.push("Kugeza: " + v("qTo"));
  lines.push("Umushoferi: " + (document.getElementById("qDriver").value === "yes" ? "Yego" : "Oya"));
  if (v("qMsg")) lines.push("", v("qMsg"));

  window.open("https://wa.me/250723346316?text=" + encodeURIComponent(lines.join("\n")), "_blank");
});

setLang("en");
</script>

</body>
</html>
